<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Owen and Dad Space Adventures</title>
<style>
  :root{
    --bg:#05060f; --ink:#e8f0ff; --dim:#8da2c8;
    --p1:#4fa8ff; --p2:#ff5a3c; --gold:#ffd23f; --danger:#ff4d6d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  /* size is set in JS so the playfield always fits exactly, on any screen */
  #stage{position:relative;width:480px;height:720px}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;background:#05060f}

  /* ---------- overlays ---------- */
  .panel{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;
    background:radial-gradient(120% 90% at 50% 0%,rgba(30,50,110,.55),rgba(5,6,15,.94));
    backdrop-filter:blur(3px);text-align:center;
  }
  .panel[hidden]{display:none}
  h1{
    margin:0;font-size:clamp(20px,5.2vmin,34px);line-height:1.15;letter-spacing:.5px;
    background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 22px rgba(255,210,63,.25);
  }
  .sub{color:var(--dim);font-size:clamp(11px,2.5vmin,14px);line-height:1.6;max-width:34ch}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  input{
    font:inherit;font-size:clamp(14px,3.4vmin,18px);text-align:center;letter-spacing:3px;text-transform:uppercase;
    padding:10px 12px;width:9ch;border-radius:10px;border:2px solid #2c3f6b;background:#0c1224;color:var(--ink);
  }
  input.name{letter-spacing:0;text-transform:none;width:13ch}
  input:focus{outline:none;border-color:var(--gold)}
  button{
    font:inherit;font-weight:700;font-size:clamp(13px,3vmin,17px);letter-spacing:1px;cursor:pointer;
    padding:12px 22px;border-radius:12px;border:2px solid #2c3f6b;background:#131c34;color:var(--ink);
    transition:transform .08s ease,border-color .15s ease,background .15s ease;
  }
  button:active{transform:translateY(2px)}
  button.go{background:linear-gradient(180deg,#2f6bd8,#1b3f8f);border-color:#6ea8ff;box-shadow:0 0 22px rgba(79,168,255,.35)}
  button.go[data-on="1"]{background:linear-gradient(180deg,#2aa96a,#13603c);border-color:#5ee6a0;box-shadow:0 0 22px rgba(94,230,160,.35)}
  .roster{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:34px}
  .chip{padding:7px 12px;border-radius:999px;border:2px solid #2c3f6b;background:#0c1224;font-size:clamp(11px,2.6vmin,13px)}
  .chip.p1{border-color:var(--p1)} .chip.p2{border-color:var(--p2)}
  .chip .ok{color:#5ee6a0}
  .keys{font-size:clamp(10px,2.3vmin,12px);color:var(--dim);line-height:1.8}
  .keys b{color:var(--ink);font-weight:600}
  .final{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .final div{min-width:110px}
  .final .v{font-size:clamp(20px,5vmin,28px);color:var(--gold)}
  .tag{font-size:11px;color:var(--dim);letter-spacing:2px}

  /* ---------- touch controls ---------- */
  /* fixed to the viewport, so on a tall phone the buttons sit in the empty
     band below the playfield instead of on top of the action */
  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  #touch > *{pointer-events:auto}
  #touch.on{display:block}
  #fire{
    position:absolute;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));width:22vmin;height:22vmin;max-width:108px;max-height:108px;
    border-radius:50%;border:3px solid rgba(255,210,63,.55);background:rgba(255,210,63,.12);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#ffd98a;letter-spacing:1px;
  }
  #fire:active{background:rgba(255,210,63,.3)}
  #auto{
    position:absolute;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));padding:9px 12px;border-radius:10px;
    border:2px solid #2c3f6b;background:rgba(12,18,36,.8);font-size:11px;color:var(--dim);
  }
  #auto[data-on="1"]{border-color:#5ee6a0;color:#5ee6a0}
  .hint{position:absolute;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:#5b6d92}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <!-- lobby -->
  <div class="panel" id="lobby">
    <h1>OWEN AND DAD<br>SPACE ADVENTURES</h1>
    <div class="sub" id="lobbySub">Both of you type the <b>same room code</b>, then hit READY. The game starts when everyone is ready.</div>
    <div class="row">
      <input class="name" id="nameIn" maxlength="12" placeholder="name">
      <input id="codeIn" maxlength="6" value="OWEN">
    </div>
    <div class="row" id="serverRow" hidden>
      <input class="name" id="serverIn" placeholder="server url" style="width:20ch;letter-spacing:0;text-transform:none">
      <button id="serverBtn">CONNECT</button>
    </div>
    <div class="roster" id="roster"></div>
    <button class="go" id="readyBtn">READY</button>
    <div class="keys">
      <b>Move</b> &nbsp;WASD or Arrow keys &nbsp;&nbsp;|&nbsp;&nbsp; <b>Shoot</b> &nbsp;Space or Enter<br>
      <b>Phone</b> &nbsp;drag anywhere to fly, tap FIRE (auto-fire is on)
    </div>
    <div class="tag" id="conn">CONNECTING…</div>
  </div>

  <!-- game over -->
  <div class="panel" id="over" hidden>
    <h1 id="overTitle">GAME OVER</h1>
    <div class="final" id="finalScores"></div>
    <div class="sub" id="overSub"></div>
    <button class="go" id="againBtn">PLAY AGAIN</button>
  </div>

  <!-- touch controls -->
  <div id="touch">
    <div id="auto" data-on="1">AUTO-FIRE</div>
    <div id="fire">FIRE</div>
    <div class="hint">drag anywhere to fly</div>
  </div>
</div>

<script src="/socket.io/socket.io.js" onerror="window.__ioLocalFailed=1"></script>

const IMG = {};
let pending = 0, ready = false;
for (const k in SPRITE_DATA) {
  pending++;
  const im = new Image();
  im.onload = im.onerror = () => { if (--pending === 0) ready = true; };
  im.src = SPRITE_DATA[k];
  IMG[k] = im;
}
// Sprites are exported at 2x so they stay sharp on retina screens.
const sw = k => (IMG[k] && IMG[k].naturalWidth ? IMG[k].naturalWidth / 2 : 24);
const sh = k => (IMG[k] && IMG[k].naturalHeight ? IMG[k].naturalHeight / 2 : 24);
function spr(k, x, y, s = 1, alpha = 1, flash = 0) {
  const im = IMG[k];
  if (!im || !im.naturalWidth) return;
  const w = (im.naturalWidth / 2) * s, h = (im.naturalHeight / 2) * s;
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
  if (flash) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.65 * flash;
    ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}

/* ---------- layout ---------- */
const stage = document.getElementById('stage');
function resize() {
  // Fit the 480x720 playfield inside the viewport without distorting it.
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = w * H / W;
  if (h > vh) { h = vh; w = h * W / H; }
  stage.style.width = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';
  const spare = vh - h;
  stage.style.marginBottom = (matchMedia('(pointer:coarse)').matches && spare > 70) ? Math.round(spare) + 'px' : '0px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  scale = cv.width / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ---------- starfield (drawn locally so it never stutters) ---------- */
const stars = [];
for (let i = 0; i < 150; i++) {
  const layer = i < 80 ? 0 : i < 125 ? 1 : 2;
  stars.push({ x: Math.random() * W, y: Math.random() * H, layer,
    s: layer === 0 ? 1 : layer === 1 ? 1.6 : 2.4,
    v: layer === 0 ? 26 : layer === 1 ? 62 : 118 });
}
const NEB = [];
for (let i = 0; i < 6; i++) NEB.push({ x: Math.random() * W, y: Math.random() * H, r: 90 + Math.random() * 130, h: Math.random() * 360, v: 12 + Math.random() * 14 });

function drawSpace(dt) {
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);
  for (const n of NEB) {
    n.y += n.v * dt; if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; n.h = Math.random() * 360; }
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, `hsla(${n.h},70%,55%,0.10)`);
    g.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
  }
  for (const s of stars) {
    s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    ctx.fillStyle = s.layer === 2 ? '#ffffff' : s.layer === 1 ? '#c9dcff' : '#7d92bd';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

/* ---------- networking ---------- */
// Normally the page is served by the game server, so io() talks to this same
// origin. If the page is hosted somewhere static (GitHub Pages), pass the
// server with ?server=https://your-app.onrender.com and it is remembered.
let socket = null, myId = null, myN = 1, joined = false, rtt = 0;
const QS = new URLSearchParams(location.search);
let SERVER_URL = QS.get('server') || '';
try { SERVER_URL = SERVER_URL || localStorage.getItem('oad_server') || ''; } catch (e) {}
if (SERVER_URL) SERVER_URL = SERVER_URL.replace(/\/+$/, '');

const W_STATE = {
  st: 'lobby', wv: 0, msg: '',
  players: new Map(), enemies: new Map(), bullets: new Map(),
  ebullets: new Map(), pickups: new Map(), fx: new Map(), boss: null,
};

const elLobby = document.getElementById('lobby');
const elOver = document.getElementById('over');
const elRoster = document.getElementById('roster');
const elConn = document.getElementById('conn');
const readyBtn = document.getElementById('readyBtn');
const codeIn = document.getElementById('codeIn');
const nameIn = document.getElementById('nameIn');

// Remember the room + name so the second device doesn't retype them every time.
try {
  codeIn.value = localStorage.getItem('oad_code') || 'OWEN';
  nameIn.value = localStorage.getItem('oad_name') || '';
} catch (e) {}

function join() {
  if (!socket) return;
  const code = (codeIn.value || 'OWEN').toUpperCase();
  const name = nameIn.value.trim();
  try { localStorage.setItem('oad_code', code); localStorage.setItem('oad_name', name); } catch (e) {}
  socket.emit('join', { code, name });
}

function connect() {
  socket = io(SERVER_URL || undefined, { transports: ['websocket', 'polling'], reconnectionDelayMax: 4000 });
  for (const [ev, fn] of HANDLERS) socket.on(ev, fn);
}
const HANDLERS = [];
const on = (ev, fn) => HANDLERS.push([ev, fn]);

on('connect', () => { elConn.textContent = 'CONNECTED'; document.getElementById('serverRow').hidden = !!SERVER_URL ? false : true; join(); });
on('connect_error', () => { elConn.textContent = 'CANNOT REACH SERVER'; document.getElementById('serverRow').hidden = false; });
on('disconnect', () => { elConn.textContent = 'RECONNECTING…'; joined = false; });

on('joined', (d) => {
  myId = d.you; myN = d.n; joined = true;
  elConn.textContent = `ROOM ${d.code} — YOU ARE PLAYER ${d.n}`;
});

on('lobby', (info) => {
  elRoster.innerHTML = info.players.map(p =>
    `<span class="chip p${p.n}">${esc(p.name)} ${p.ready ? '<span class="ok">READY</span>' : ''}</span>`
  ).join('');
  if (info.players.length < 2) {
    document.getElementById('lobbySub').innerHTML =
      `Waiting for a second pilot — have them open this page and enter room code <b>${esc(info.code)}</b>. You can also start solo.`;
  }
});

let iAmReady = false;
readyBtn.onclick = () => {
  if (!joined || !socket) return;
  iAmReady = !iAmReady;
  readyBtn.dataset.on = iAmReady ? '1' : '0';
  readyBtn.textContent = iAmReady ? 'WAITING…' : 'READY';
  socket.emit('ready', iAmReady);
};
codeIn.onchange = () => { iAmReady = false; readyBtn.dataset.on = '0'; readyBtn.textContent = 'READY'; join(); };
nameIn.onchange = join;
document.getElementById('againBtn').onclick = () => {
  elOver.hidden = true; elLobby.hidden = false;
  iAmReady = false; readyBtn.dataset.on = '0'; readyBtn.textContent = 'READY';
};

setInterval(() => { if (socket && socket.connected) socket.emit('ping2', Date.now()); }, 2000);
on('pong2', (t) => { rtt = Date.now() - t; socket.emit('rtt', rtt); });

/* ---------- snapshot handling ---------- */
function sync(map, rows, make, update) {
  const seen = new Set();
  for (const row of rows) {
    seen.add(row[0]);
    let o = map.get(row[0]);
    if (!o) { o = make(row); map.set(row[0], o); }
    update(o, row);
  }
  for (const k of map.keys()) if (!seen.has(k)) map.delete(k);
}

on('snap', (s) => {
  const prevState = W_STATE.st;
  W_STATE.st = s.st; W_STATE.wv = s.wv; W_STATE.msg = s.msg;

  sync(W_STATE.players, s.ps,
    r => ({ id: r[0], x: r[2], y: r[3] }),
    (o, r) => {
      o.n = r[1]; o.hp = r[4]; o.lives = r[5]; o.score = r[6];
      o.alive = !!r[7]; o.invul = !!r[8]; o.wep = r[9]; o.moving = !!r[10];
      o.name = r[11]; o.ready = !!r[12]; o.ping = r[13];
      o.sx = r[2]; o.sy = r[3];
      if (o.id !== myId) { o.x += (o.sx - o.x) * 0.35; o.y += (o.sy - o.y) * 0.35; }
    });

  sync(W_STATE.enemies, s.es,
    r => ({ id: r[0], x: r[2], y: r[3] }),
    (o, r) => { o.type = r[1]; o.vx = r[4]; o.vy = r[5]; o.frame = r[6]; o.hurt = r[7];
                o.x += (r[2] - o.x) * 0.5; o.y += (r[3] - o.y) * 0.5; });

  sync(W_STATE.bullets, s.bs,
    r => ({ id: r[0], x: r[1], y: r[2] }),
    (o, r) => { o.vx = r[3]; o.vy = r[4]; o.n = r[5]; o.x += (r[1] - o.x) * 0.6; o.y += (r[2] - o.y) * 0.6; });

  sync(W_STATE.ebullets, s.eb,
    r => ({ id: r[0], x: r[1], y: r[2] }),
    (o, r) => { o.vx = r[3]; o.vy = r[4]; o.missile = r[5]; o.x += (r[1] - o.x) * 0.6; o.y += (r[2] - o.y) * 0.6; });

  sync(W_STATE.pickups, s.pu,
    r => ({ id: r[0], x: r[1], y: r[2] }),
    (o, r) => { o.kind = r[3]; o.x = r[1]; o.y += (r[2] - o.y) * 0.5; });

  sync(W_STATE.fx, s.fx,
    r => ({ id: r[0], x: r[1], y: r[2] }),
    (o, r) => { o.t = r[3]; o.size = r[4]; });

  if (s.bo) {
    const b = W_STATE.boss || (W_STATE.boss = { x: s.bo[2], y: s.bo[3] });
    b.id = s.bo[0]; b.kind = s.bo[1]; b.vx = s.bo[4];
    b.frame = s.bo[6]; b.hurt = s.bo[7]; b.hpFrac = s.bo[8];
    b.x += (s.bo[2] - b.x) * 0.5; b.y += (s.bo[3] - b.y) * 0.5;
  } else W_STATE.boss = null;

  if (s.st === 'playing' && prevState !== 'playing') {
    elLobby.hidden = true; elOver.hidden = true;
    iAmReady = false; readyBtn.dataset.on = '0'; readyBtn.textContent = 'READY';
  }
  if (s.st === 'over' && prevState !== 'over') showGameOver();
  if (s.st === 'lobby') elLobby.hidden = false;
});

function showGameOver() {
  const ps = [...W_STATE.players.values()].sort((a, b) => b.score - a.score);
  document.getElementById('finalScores').innerHTML = ps.map(p =>
    `<div><div class="tag">${esc(p.name)}</div><div class="v">${p.score.toLocaleString()}</div></div>`
  ).join('');
  let title = 'GAME OVER', sub = `You reached wave ${W_STATE.wv}.`;
  if (ps.length > 1) {
    if (ps[0].score === ps[1].score) { title = 'A PERFECT TIE'; sub = `Dead even at ${ps[0].score.toLocaleString()} — wave ${W_STATE.wv}.`; }
    else { title = `${ps[0].name.toUpperCase()} WINS`; sub = `${esc(ps[0].name)} out-scored ${esc(ps[1].name)} by ${(ps[0].score - ps[1].score).toLocaleString()} — wave ${W_STATE.wv}.`; }
  }
  document.getElementById('overTitle').textContent = title;
  document.getElementById('overSub').textContent = sub;
  elOver.hidden = false;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- input ---------- */
// One flag object keyed by event.code. Using `code` (not `key`) means every
// arrow / WASD / Space / Enter press is tracked independently, so holding
// several at once never drops one.
const held = Object.create(null);
addEventListener('keydown', e => {
  if (e.target && /INPUT/.test(e.target.tagName)) return;
  held[e.code] = true;
  if (/^(Arrow|Space|Enter|Key[WASD])/.test(e.code)) e.preventDefault();
}, { passive: false });
addEventListener('keyup', e => { held[e.code] = false; }, { passive: false });
addEventListener('blur', () => { for (const k in held) held[k] = false; });

const touchEl = document.getElementById('touch');
const autoEl = document.getElementById('auto');
const fireEl = document.getElementById('fire');
let isTouch = matchMedia('(pointer:coarse)').matches;
if (isTouch) touchEl.classList.add('on');
let autoFire = true, fireHeld = false;
autoEl.onclick = () => { autoFire = !autoFire; autoEl.dataset.on = autoFire ? '1' : '0'; };
const holdFire = v => e => { e.preventDefault(); fireHeld = v; };
fireEl.addEventListener('pointerdown', holdFire(true));
addEventListener('pointerup', holdFire(false));
addEventListener('pointercancel', holdFire(false));

// Drag-to-fly: the ship chases your finger, which is far easier for a kid
// than an on-screen d-pad.
let dragId = null, dragTargetX = 0, dragTargetY = 0;
cv.addEventListener('pointerdown', e => {
  if (!isTouch) { touchEl.classList.add('on'); isTouch = true; }
  dragId = e.pointerId;
  const me = W_STATE.players.get(myId);
  const p = toWorld(e);
  dragTargetX = me ? me.x + (p.x - me.x) * 0.35 : p.x;
  dragTargetY = me ? me.y + (p.y - me.y) * 0.35 : p.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const p = toWorld(e);
  dragTargetX = p.x; dragTargetY = p.y - 46;   // offset so your thumb doesn't cover the ship
});
const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

function readInput() {
  let ax = 0, ay = 0, f = 0;
  if (held.KeyD || held.ArrowRight) ax += 1;
  if (held.KeyA || held.ArrowLeft) ax -= 1;
  if (held.KeyS || held.ArrowDown) ay += 1;
  if (held.KeyW || held.ArrowUp) ay -= 1;
  if (held.Space || held.Enter || held.NumpadEnter) f = 1;

  if (dragId !== null) {
    const me = W_STATE.players.get(myId);
    if (me) {
      ax = Math.max(-1, Math.min(1, (dragTargetX - me.x) / 26));
      ay = Math.max(-1, Math.min(1, (dragTargetY - me.y) / 26));
    }
  }
  if (fireHeld || (autoFire && isTouch)) f = 1;
  return { ax, ay, f };
}

let lastSent = 0, lastInput = { ax: 9, ay: 9, f: 9 };
function sendInput(inp) {
  const now = performance.now();
  const changed = inp.ax !== lastInput.ax || inp.ay !== lastInput.ay || inp.f !== lastInput.f;
  if (!changed && now - lastSent < 100) return;
  lastSent = now; lastInput = inp;
  if (socket) socket.emit('input', inp);
}

/* ---------- drawing ---------- */
const ENEMY_SPR = {
  grunt: ['grunt_a', 'grunt_b'], scout: ['scout_a', 'scout_b'],
  drone: ['drone_a', 'drone_b'], mine: ['mine_a', 'mine_b'],
  bomber: ['bomber', 'bomber'],
};
const BOSS_SPR = { hive: ['hive_a', 'hive_b'], mech: ['mech_a', 'mech_b'], brain: ['brain_a', 'brain_b'] };
const PU_COLOR = { double: '#4fa8ff', rapid: '#ffd23f', shield: '#5ee6a0' };
const PU_LABEL = { double: '▲', rapid: '⚡', shield: '+' };

function drawPickup(u, time) {
  const bob = Math.sin(time * 5 + u.id) * 3;
  const c = PU_COLOR[u.kind] || '#fff';
  ctx.save();
  ctx.translate(u.x, u.y + bob);
  ctx.shadowColor = c; ctx.shadowBlur = 16;
  ctx.fillStyle = 'rgba(8,12,24,.9)';
  ctx.strokeStyle = c; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(-13, -13, 26, 26, 7); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = c; ctx.font = 'bold 16px ui-monospace,monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(PU_LABEL[u.kind] || '?', 0, 1);
  ctx.restore();
}

function drawShip(p, time) {
  if (!p.alive) return;
  if (p.invul && Math.floor(time * 12) % 2 === 0) return;      // blink while invulnerable
  const key = (p.n === 1 ? 'p1' : 'p2') + '_thrust';   // engines always lit
  // shield ring while invulnerable
  if (p.invul) {
    ctx.save(); ctx.strokeStyle = p.n === 1 ? 'rgba(79,168,255,.8)' : 'rgba(255,90,60,.8)';
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, 6.2832); ctx.stroke(); ctx.restore();
  }
  spr(key, p.x, p.y + Math.sin(time * 9 + p.n) * 0.8, 1);
  if (p.id === myId) {
    ctx.strokeStyle = 'rgba(94,230,160,.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.x - 7, p.y + 30); ctx.lineTo(p.x, p.y + 24); ctx.lineTo(p.x + 7, p.y + 30); ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(200,220,255,.75)'; ctx.font = '9px ui-monospace,monospace'; ctx.textAlign = 'center';
    ctx.fillText(p.name || '', p.x, p.y + 36);
  }
  if (p.wep) {
    ctx.fillStyle = p.wep === 1 ? '#4fa8ff' : '#ffd23f';
    ctx.font = 'bold 8px ui-monospace,monospace'; ctx.textAlign = 'center';
    ctx.fillText(p.wep === 1 ? 'SPREAD' : 'RAPID', p.x, p.y - 30);
  }
}

function bar(x, y, w, h, frac, col) {
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, Math.max(0, w * frac), h);
}

function drawHUD(time) {
  const ps = [...W_STATE.players.values()].sort((a, b) => a.n - b.n);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(5,8,18,.55)'; ctx.fillRect(0, 0, W, 46);
  for (let i = 0; i < ps.length && i < 2; i++) {
    const p = ps[i];
    const left = i === 0;
    const x = left ? 10 : W - 10;
    ctx.textAlign = left ? 'left' : 'right';
    ctx.fillStyle = p.n === 1 ? '#4fa8ff' : '#ff5a3c';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillText(`${(p.name || 'P' + p.n).toUpperCase()}${p.id === myId ? ' (YOU)' : ''}`, x, 15);
    ctx.fillStyle = '#e8f0ff'; ctx.font = 'bold 15px ui-monospace,monospace';
    ctx.fillText(p.score.toLocaleString(), x, 31);
    const bx = left ? 10 : W - 94;
    bar(bx, 36, 84, 5, p.hp / 100, p.hp > 40 ? '#5ee6a0' : '#ff4d6d');
    ctx.fillStyle = '#ffd23f'; ctx.font = '10px ui-monospace,monospace';
    ctx.textAlign = left ? 'left' : 'right';
    ctx.fillText('♥'.repeat(Math.max(0, p.lives)), left ? 98 : W - 98, 41);
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#8da2c8'; ctx.font = '10px ui-monospace,monospace';
  ctx.fillText(`WAVE ${W_STATE.wv}`, W / 2, 15);
  ctx.fillText(`${rtt}ms`, W / 2, 29);

  if (W_STATE.boss) {
    bar(60, 52, W - 120, 7, W_STATE.boss.hpFrac, '#ff4d6d');
    ctx.fillStyle = '#ff9aad'; ctx.font = 'bold 9px ui-monospace,monospace';
    ctx.fillText('BOSS', W / 2, 68);
  }

  if (W_STATE.msg) {
    ctx.save();
    ctx.textAlign = 'center';
    // shrink long banners ("WAVE 15 - WARNING: MEGA BRAIN") so they never clip
    let fs = 22;
    ctx.font = `bold ${fs}px ui-monospace,monospace`;
    const maxW = W - 28;
    const tw = ctx.measureText(W_STATE.msg).width;
    if (tw > maxW) { fs = Math.max(11, Math.floor(fs * maxW / tw)); ctx.font = `bold ${fs}px ui-monospace,monospace`; }
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.fillStyle = W_STATE.msg.includes('WARNING') ? '#ff4d6d' : '#ffd23f';
    ctx.fillText(W_STATE.msg, W / 2, H * 0.42);
    ctx.restore();
  }

  // spectating notice
  const me = W_STATE.players.get(myId);
  if (me && !me.alive && W_STATE.st === 'playing') {
    ctx.textAlign = 'center'; ctx.font = 'bold 13px ui-monospace,monospace';
    ctx.fillStyle = me.lives > 0 ? '#ffd23f' : '#ff4d6d';
    ctx.fillText(me.lives > 0 ? 'RESPAWNING…' : 'OUT OF LIVES — CHEER THEM ON', W / 2, H * 0.6);
  }
}

/* ---------- main loop ---------- */
let prev = performance.now(), time = 0;
function frame(now) {
  let dt = (now - prev) / 1000; prev = now;
  if (dt > 0.1) dt = 0.1;
  time += dt;

  const inp = readInput();
  if (joined) sendInput(inp);

  // local prediction for your own ship
  const me = W_STATE.players.get(myId);
  if (me && me.alive && W_STATE.st === 'playing') {
    let ax = inp.ax, ay = inp.ay;
    const m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
    me.x += ax * 275 * dt; me.y += ay * 275 * dt;
    me.x = Math.max(18, Math.min(W - 18, me.x));
    me.y = Math.max(H * 0.22, Math.min(H - 24, me.y));
    // ease back toward the server's authoritative position
    me.x += (me.sx - me.x) * Math.min(1, dt * 4);
    me.y += (me.sy - me.y) * Math.min(1, dt * 4);
    if (Math.abs(me.sx - me.x) > 60 || Math.abs(me.sy - me.y) > 60) { me.x = me.sx; me.y = me.sy; }
  }

  drawSpace(dt);

  if (ready) {
    for (const u of W_STATE.pickups.values()) { u.y += 95 * dt; drawPickup(u, time); }

    for (const b of W_STATE.ebullets.values()) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.missile) spr('missile', b.x, b.y, 0.9);
      else {
        ctx.save(); ctx.shadowColor = '#ff6b9d'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#ff6b9d'; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, 6.2832); ctx.fill(); ctx.restore();
      }
    }

    for (const e of W_STATE.enemies.values()) {
      e.x += e.vx * dt; e.y += e.vy * dt;
      const set = ENEMY_SPR[e.type] || ENEMY_SPR.grunt;
      spr(set[e.frame ? 1 : 0], e.x, e.y, 1, 1, e.hurt ? 1 : 0);
    }

    const bs = W_STATE.boss;
    if (bs) {
      bs.x += bs.vx * dt;
      const set = BOSS_SPR[bs.kind] || BOSS_SPR.hive;
      const key = (bs.kind === 'hive' && bs.hpFrac < 0.35) ? 'hive_hurt' : set[bs.frame ? 1 : 0];
      spr(key, bs.x, bs.y, 1, 1, bs.hurt ? 1 : 0);
    }

    for (const b of W_STATE.bullets.values()) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = b.n === 1 ? '#4fa8ff' : '#ff5a3c';
      ctx.fillRect(b.x - 1.5, b.y, 3, 16);
      ctx.globalAlpha = 1; ctx.restore();
      spr('bullet', b.x, b.y, 0.8);
    }

    for (const p of W_STATE.players.values()) drawShip(p, time);

    for (const f of W_STATE.fx.values()) {
      const k = f.t < 0.34 ? 'boom_a' : f.t < 0.67 ? 'boom_b' : 'boom_c';
      spr(k, f.x, f.y, (f.size || 1) * (0.7 + f.t * 0.8), 1 - f.t * 0.55);
    }
  } else {
    ctx.fillStyle = '#8da2c8'; ctx.font = '12px ui-monospace,monospace'; ctx.textAlign = 'center';
    ctx.fillText('LOADING SPRITES…', W / 2, H / 2);
  }

  if (W_STATE.st === 'playing') drawHUD(time);

  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
document.getElementById('serverIn').value = SERVER_URL;
document.getElementById('serverBtn').onclick = () => {
  SERVER_URL = document.getElementById('serverIn').value.trim().replace(/\/+$/, '');
  try { localStorage.setItem('oad_server', SERVER_URL); } catch (e) {}
  location.href = location.pathname + (SERVER_URL ? '?server=' + encodeURIComponent(SERVER_URL) : '');
};

function withSocketIO(done) {
  if (typeof io !== 'undefined') return done();
  const tryUrls = [];
  if (SERVER_URL) tryUrls.push(SERVER_URL + '/socket.io/socket.io.js');
  tryUrls.push('https://cdn.socket.io/4.7.5/socket.io.min.js');
  (function next(i) {
    if (i >= tryUrls.length) {
      elConn.textContent = 'NO SERVER FOUND';
      document.getElementById('serverRow').hidden = false;
      document.getElementById('lobbySub').innerHTML =
        'This page needs its game server. Enter the address of your server (for example <b>https://your-app.onrender.com</b>) and press CONNECT.';
      return;
    }
    const sc = document.createElement('script');
    sc.src = tryUrls[i];
    sc.onload = () => done();
    sc.onerror = () => next(i + 1);
    document.head.appendChild(sc);
  })(0);
}

resize();
requestAnimationFrame(frame);
withSocketIO(connect);
</script>
